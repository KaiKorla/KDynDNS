[package]
name = "kdyndns"
version = "3.0.1"
edition = "2024"

[dependencies]
actix-web = "4"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "1"
base64 = "0.22"
argon2 = "0.5"
password-hash = "0.6"
rpassword = "7"
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
listenfd = "1"
dns-update = "0.1"
